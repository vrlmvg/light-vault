[tool]
id = "io.github.vrlmvg.vault"
label = "Vaultwarden"
versionCode = 1
versionName = "0.1.0"
permissions = ["android.permission.INTERNET"]
# cleartext-http lets you reach a Vaultwarden on your home network over plain http.
capabilities = ["cleartext-http"]
# for the LightOS emulator, use the line below and build with -DlightSdk.allowAltServerPackage=true
serverPackage = "com.thelightphone.sdk.emulator"
# serverPackage = "com.lightos"  # restore before installing on the real phone / submitting
